<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ราคาสินค้า — Daily Price Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f8f9fa;
    --border: #e2e5e9;
    --up: #dc2626;
    --up-soft: rgba(220,38,38,0.08);
    --down: #16a34a;
    --down-soft: rgba(22,163,74,0.08);
    --neutral: #6b7280;
    --text: #111827;
    --text-dim: #9ca3af;
    --accent: #e07b1e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* grain overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.015'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 40px 20px 80px; }

  /* header */
  header {
    display: flex; align-items: flex-start; justify-content: space-between;
    flex-wrap: wrap; gap: 16px; margin-bottom: 40px;
    padding-bottom: 28px; border-bottom: 1px solid var(--border);
  }
  .logo-block h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text);
  }
  .logo-block .sub {
    font-size: 13px; color: var(--neutral); margin-top: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .date-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; color: var(--accent);
    background: rgba(240,180,41,0.08);
    border: 1px solid rgba(240,180,41,0.2);
    padding: 6px 14px; border-radius: 20px;
    white-space: nowrap; align-self: center;
  }

  /* stats row */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 32px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px;
    transition: border-color .2s;
  }
  .stat:hover { border-color: #c5c9d0; }
  .stat .num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px; font-weight: 600; line-height: 1;
  }
  .stat .label { font-size: 12px; color: var(--neutral); margin-top: 6px; }
  .stat.up .num { color: var(--up); }
  .stat.down .num { color: var(--down); }
  .stat.total .num { color: var(--text); }

  /* section headings */
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 40px 0 16px;
  }
  .section-head h2 {
    font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px;
  }

  /* filter bar */
  .filter-bar {
    display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .filter-btn {
    font-family: 'Sarabun', sans-serif;
    font-size: 13px; padding: 6px 16px;
    border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--neutral);
    cursor: pointer; transition: all .15s;
  }
  .filter-btn:hover { border-color: #aab0bb; color: var(--text); }
  .filter-btn.active { background: var(--text); color: #fff; border-color: var(--text); font-weight: 600; }
  .filter-btn.up.active { background: var(--up); color: #fff; border-color: var(--up); }
  .filter-btn.down.active { background: var(--down); color: #000; border-color: var(--down); }

  /* data button */
  .btn-data {
    margin-left: auto;
    font-family: 'Sarabun', sans-serif;
    font-size: 13px; padding: 6px 18px;
    border-radius: 20px; border: 1px solid var(--accent);
    background: rgba(240,180,41,0.08); color: var(--accent);
    cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 6px;
  }
  .btn-data:hover { background: rgba(240,180,41,0.18); }

  /* table */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead tr { border-bottom: 1px solid var(--border); }
  thead th {
    padding: 12px 16px; text-align: left;
    font-size: 11px; font-weight: 600;
    color: var(--text-dim); letter-spacing: .08em; text-transform: uppercase;
    font-family: 'IBM Plex Mono', monospace;
  }
  thead th.right { text-align: right; }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .12s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(0,0,0,0.02); }
  td { padding: 13px 16px; vertical-align: middle; }
  td.right { text-align: right; }

  .group-tag {
    font-size: 11px; color: var(--neutral);
    background: rgba(0,0,0,0.05);
    padding: 2px 8px; border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .prod-name { font-weight: 500; color: var(--text); }
  .price-mono { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    padding: 3px 10px; border-radius: 20px; font-weight: 600;
  }
  .badge.up { background: var(--up-soft); color: var(--up); }
  .badge.down { background: var(--down-soft); color: var(--down); }
  .badge.same { background: rgba(107,114,128,0.08); color: var(--neutral); }

  /* loading / empty / error states */
  .state-box {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 60px 20px; gap: 12px;
    color: var(--neutral); font-size: 14px;
  }
  .state-box .ico { font-size: 36px; }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* modal */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.4); backdrop-filter: blur(4px);
    z-index: 100; align-items: center; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px; width: 90%; max-width: 700px;
    max-height: 80vh; overflow-y: auto;
    animation: popIn .2s ease;
  }
  @keyframes popIn { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { font-size: 16px; font-weight: 600; }
  .close-btn {
    background: none; border: none; color: var(--neutral);
    font-size: 20px; cursor: pointer; line-height: 1;
    padding: 4px 8px; border-radius: 6px; transition: all .15s;
  }
  .close-btn:hover { background: var(--surface); color: var(--text); }
  .modal table { font-size: 13px; }
  .modal thead th { padding: 8px 12px; }
  .modal td { padding: 9px 12px; }

  footer { margin-top: 48px; text-align: center; font-size: 12px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }

  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(3,1fr); gap: 8px; }
    .stat .num { font-size: 22px; }
    thead th, td { padding: 10px 10px; font-size: 13px; }
    .filter-btn, .btn-data { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo-block">
      <h1>📊 Price Tracker</h1>
      <div class="sub" id="sub-text">กำลังโหลด...</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
      <div class="date-badge" id="date-badge">—</div>
      <button class="btn-data" style="margin-left:0;" onclick="window.open('https://docs.google.com/spreadsheets/d/1qo1zcJkR6jG5OkbvNdx5bxIPpcfFsshd1RvlctjaFPc/edit#gid=1457383902','_blank')">📋 ดู DATA ทั้งหมด</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat up">
      <div class="num" id="cnt-up">—</div>
      <div class="label">🔺 ขึ้นราคา</div>
    </div>
    <div class="stat down">
      <div class="num" id="cnt-down">—</div>
      <div class="label">🔻 ลดราคา</div>
    </div>
    <div class="stat total">
      <div class="num" id="cnt-total">—</div>
      <div class="label">รายการทั้งหมดวันนี้</div>
    </div>
  </div>

  <!-- ⛽ Oil price section -->
  <div class="section-head">
    <h2>⛽ ราคาน้ำมันวันนี้</h2>
    <div class="date-badge" id="oil-date-badge">—</div>
  </div>
  <div class="table-wrap" style="margin-bottom: 8px;">
    <div class="state-box" id="oil-loading">
      <div class="spinner"></div>
      <span>กำลังดึงราคาน้ำมัน...</span>
    </div>
    <div id="oil-container" style="display:none;"></div>
  </div>

  <div class="section-head">
    <h2>🛒 รายการราคาสินค้าที่เปลี่ยนวันนี้</h2>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all',this)">ทั้งหมด</button>
    <button class="filter-btn up" onclick="setFilter('up',this)">🔺 ขึ้นราคา</button>
    <button class="filter-btn down" onclick="setFilter('down',this)">🔻 ลดราคา</button>
  </div>

  <div class="table-wrap">
    <div class="state-box" id="loading-state">
      <div class="spinner"></div>
      <span>กำลังดึงข้อมูลจาก Google Sheet...</span>
    </div>
    <div id="table-container" style="display:none;"></div>
  </div>

  <footer id="footer-text">Price Tracker v5 · ข้อมูลจาก Google Sheets</footer>
</div>

<!-- Modal: ดู DATA ทั้งหมด -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <h2>📋 ราคาสินค้าทั้งหมด — วันนี้</h2>
      <button class="close-btn" onclick="closeModalDirect()">✕</button>
    </div>
    <div id="modal-body">กำลังโหลด...</div>
  </div>
</div>

<script>
// ============================================================
//  CONFIG — แก้ค่าตรงนี้
// ============================================================
const SHEET_ID    = "1qo1zcJkR6jG5OkbvNdx5bxIPpcfFsshd1RvlctjaFPc";
const SHEET_NAME  = "เช็คราคาขาย8-2569";
const DATA_START_ROW = 3;   // row เริ่มต้นข้อมูล (1-based)
const DATE_ROW    = 2;      // row วันที่ (1-based)
const FIRST_DATE_COL = 6;   // col เริ่มวันที่ (1-based)
const COL_URL     = 4;
const COL_NAME    = 3;
const COL_GROUP   = 1;

// แท็บราคาน้ำมัน — โครงสร้างเหมือนตารางราคาสินค้า: แถว 2 = หัวตาราง (ชื่อน้ำมัน / วันที่ไล่ไปทางขวา)
// คอลัมน์ A = ชื่อน้ำมัน, คอลัมน์ B เป็นต้นไป = ราคาตามวันที่ (ตรงกับ Apps Script ที่ตั้งไว้)
const OIL_GID           = "506035330";
const OIL_HEADER_ROW    = 2;  // 1-based — แถวที่มีคำว่า "ชื่อน้ำมัน" และวันที่
const OIL_DATA_START_ROW = 3; // 1-based — แถวแรกที่เป็นข้อมูลน้ำมันจริง
const OIL_COL_NAME      = 1;  // คอลัมน์ A
const OIL_FIRST_DATE_COL = 2; // คอลัมน์ B เป็นต้นไป
// ============================================================

let allChanges = [];
let allRows    = [];
let currentFilter = 'all';

// ── Fetch Sheet via CSV export (CORS-safe, ไม่ต้อง API key) ───
async function fetchSheetByGid(gid) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
  const res  = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  return parseCSV(text);
}

async function fetchSheet() {
  // ใช้ GID 1842327973 ตามลิงก์ที่แชร์มา (แท็บราคาสินค้า)
  const GID = "1842327973";
  return fetchSheetByGid(GID);
}

// ── CSV parser รองรับ field ที่มี comma และ quote ─────────────
function parseCSV(text) {
  const rows = [];
  const lines = text.split(/\r?\n/);
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = [];
    let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) {
        cols.push(cur); cur = "";
      } else { cur += ch; }
    }
    cols.push(cur);
    rows.push(cols);
  }
  return rows;  // rows[r][c] = string
}

function toNum(s) {
  if (s === null || s === undefined || s === "") return null;
  const n = parseFloat(String(s).replace(/,/g, ""));
  return isNaN(n) ? null : n;
}

function fmt(n) {
  if (n === null || n === undefined || n === "") return "—";
  return Number(n).toLocaleString("th-TH") + " ฿";
}

function todayStr() {
  const d = new Date();
  return d.getDate() + "/" + (d.getMonth()+1) + "/" + (d.getFullYear()+543);
}

// หาคอลัมน์ index (0-based) ของ "วันนี้" ในแถวหัวตารางที่กำหนด
// headerRowIdx0 = index ของแถวหัวตาราง (0-based), firstDateCol1 = คอลัมน์แรกที่เป็นวันที่ (1-based)
function findTodayColIndexGeneric(rows, headerRowIdx0, firstDateCol1) {
  const today = new Date();
  const day = today.getDate(), month = today.getMonth()+1;
  const yearCE = today.getFullYear(), yearBE = yearCE + 543;

  const row = rows[headerRowIdx0];
  if (!row) return -1;

  for (let c = firstDateCol1 - 1; c < row.length; c++) {
    const str = String(row[c] || "").trim();
    if (!str) continue;
    if (str.includes("/")) {
      const p = str.split("/");
      if (p.length >= 2) {
        const dd = parseInt(p[0]), mm = parseInt(p[1]);
        const yy = p[2] ? parseInt(p[2]) : 0;
        if (dd === day && mm === month) {
          if (!p[2] || yy === yearBE || yy === yearCE) return c;
        }
      }
    }
    if (str.includes("-")) {
      const p = str.split("-");
      if (p.length >= 2) {
        const dd = parseInt(p[0]), mm = parseInt(p[1]);
        if (dd === day && mm === month) return c;
      }
    }
  }
  return -1;
}

function findTodayColIndex(rows) {
  return findTodayColIndexGeneric(rows, DATE_ROW - 1, FIRST_DATE_COL);
}

async function load() {
  try {
    const rows = await fetchSheet();

    const todayColIdx = findTodayColIndex(rows);
    const prevColIdx  = todayColIdx > 0 ? todayColIdx - 1 : -1;

    const changes = [];
    const allData = [];

    for (let r = DATA_START_ROW - 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row) continue;

      const name  = String(row[COL_NAME  - 1] || "").trim();
      const group = String(row[COL_GROUP - 1] || "").trim();
      if (!name) continue;

      const todayPrice = todayColIdx >= 0 ? toNum(row[todayColIdx]) : null;
      const prevPrice  = prevColIdx  >= 0 ? toNum(row[prevColIdx])  : null;

      allData.push({ name, group, todayPrice, prevPrice });

      if (todayPrice !== null && prevPrice !== null &&
          typeof todayPrice === "number" && typeof prevPrice === "number" &&
          todayPrice !== prevPrice) {
        const diff = todayPrice - prevPrice;
        changes.push({
          group, name,
          oldPrice: prevPrice, newPrice: todayPrice,
          diff, pct: ((diff / prevPrice) * 100).toFixed(1),
          direction: diff > 0 ? "up" : "down",
        });
      }
    }

    allChanges = changes;
    allRows    = allData;
    renderDashboard();

  } catch(e) {
    console.error(e);
    document.getElementById("loading-state").innerHTML = `
      <div class="ico">⚠️</div>
      <span>โหลดข้อมูลไม่ได้: ${e.message}</span>
      <span style="font-size:12px;color:var(--text-dim)">ตรวจสอบว่า Sheet เปิด Public แล้ว</span>`;
  }
}

function renderDashboard() {
  const upList   = allChanges.filter(c => c.direction === "up");
  const downList = allChanges.filter(c => c.direction === "down");

  document.getElementById("cnt-up").textContent    = upList.length;
  document.getElementById("cnt-down").textContent  = downList.length;
  document.getElementById("cnt-total").textContent = allRows.filter(r => r.todayPrice !== null).length;
  document.getElementById("date-badge").textContent = "วันที่ " + todayStr();
  document.getElementById("sub-text").textContent   = "อัพเดตล่าสุด " + new Date().toLocaleTimeString("th-TH");

  renderTable(currentFilter);
  renderModal();
}

function renderTable(filter) {
  const list = filter === "all" ? allChanges
             : allChanges.filter(c => c.direction === filter);

  document.getElementById("loading-state").style.display = "none";
  const container = document.getElementById("table-container");
  container.style.display = "block";

  if (list.length === 0) {
    container.innerHTML = `<div class="state-box">
      <div class="ico">${filter === "all" ? "✅" : "—"}</div>
      <span>${filter === "all" ? "ไม่มีรายการที่ราคาเปลี่ยนวันนี้" : "ไม่มีรายการในหมวดนี้"}</span>
    </div>`;
    return;
  }

  let html = `<table>
    <thead><tr>
      <th>กลุ่ม</th>
      <th>ชื่อสินค้า</th>
      <th class="right">ราคาเมื่อวาน</th>
      <th class="right">ราคาวันนี้</th>
      <th class="right">เปลี่ยน</th>
    </tr></thead><tbody>`;

  for (const c of list) {
    const sign = c.direction === "up" ? "+" : "−";
    html += `<tr>
      <td><span class="group-tag">${c.group || "—"}</span></td>
      <td><span class="prod-name">${c.name}</span></td>
      <td class="right price-mono">${fmt(c.oldPrice)}</td>
      <td class="right price-mono" style="color:var(--${c.direction})">${fmt(c.newPrice)}</td>
      <td class="right">
        <span class="badge ${c.direction}">${sign}${Math.abs(c.pct)}%</span>
      </td>
    </tr>`;
  }
  html += "</tbody></table>";
  container.innerHTML = html;
}

function renderModal() {
  const data = allRows.filter(r => r.todayPrice !== null);
  if (data.length === 0) { document.getElementById("modal-body").innerHTML = "<p style='color:var(--neutral)'>ยังไม่มีข้อมูลวันนี้</p>"; return; }

  let html = `<table>
    <thead><tr>
      <th>กลุ่ม</th>
      <th>ชื่อสินค้า</th>
      <th class="right">ราคาเมื่อวาน</th>
      <th class="right">ราคาวันนี้</th>
      <th class="right">เปลี่ยน</th>
    </tr></thead><tbody>`;

  for (const r of data) {
    let badge = "<span style='color:var(--text-dim);font-size:12px'>—</span>";
    if (r.todayPrice !== null && r.prevPrice !== null && r.todayPrice !== r.prevPrice) {
      const diff = r.todayPrice - r.prevPrice;
      const pct  = ((diff / r.prevPrice) * 100).toFixed(1);
      const dir  = diff > 0 ? "up" : "down";
      const sign = dir === "up" ? "+" : "−";
      badge = `<span class="badge ${dir}">${sign}${Math.abs(pct)}%</span>`;
    }
    html += `<tr>
      <td><span class="group-tag">${r.group || "—"}</span></td>
      <td>${r.name}</td>
      <td class="right price-mono">${fmt(r.prevPrice)}</td>
      <td class="right price-mono" style="font-weight:600">${fmt(r.todayPrice)}</td>
      <td class="right">${badge}</td>
    </tr>`;
  }
  html += "</tbody></table>";
  document.getElementById("modal-body").innerHTML = html;
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderTable(f);
}

function openModal()  { document.getElementById("modal-bg").classList.add("show"); }
function closeModalDirect() { document.getElementById("modal-bg").classList.remove("show"); }
function closeModal(e) { if (e.target === document.getElementById("modal-bg")) closeModalDirect(); }

// ============================================================
//  ⛽ ราคาน้ำมัน — โครงสร้างเหมือนตารางราคาสินค้า (คอลัมน์ตามวันที่)
//  อ่านคอลัมน์ "วันนี้" กับ "เมื่อวาน" ตรงจากชีตเลย ไม่ต้องเก็บ history เอง
// ============================================================
async function loadOil() {
  try {
    const rows = await fetchSheetByGid(OIL_GID);

    const todayColIdx = findTodayColIndexGeneric(rows, OIL_HEADER_ROW - 1, OIL_FIRST_DATE_COL);
    const prevColIdx  = todayColIdx > (OIL_FIRST_DATE_COL - 1) ? todayColIdx - 1 : -1;

    const headerRow = rows[OIL_HEADER_ROW - 1] || [];
    const dateStr = todayColIdx >= 0 ? String(headerRow[todayColIdx] || "").trim() : "";

    const oilChanges = [];
    for (let r = OIL_DATA_START_ROW - 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row) continue;
      const name = String(row[OIL_COL_NAME - 1] || "").trim();
      if (!name) continue;

      const price     = todayColIdx >= 0 ? toNum(row[todayColIdx]) : null;
      const prevPrice = prevColIdx  >= 0 ? toNum(row[prevColIdx])  : null;
      if (price === null) continue;

      let diff = null, pct = null, direction = null;
      if (prevPrice !== null) {
        if (price !== prevPrice) {
          diff = price - prevPrice;
          pct  = ((diff / prevPrice) * 100).toFixed(1);
          direction = diff > 0 ? "up" : "down";
        } else {
          direction = "same";
        }
      }
      oilChanges.push({ name, price, prevPrice, diff, pct, direction });
    }

    renderOil(oilChanges, dateStr);
  } catch (e) {
    console.error(e);
    document.getElementById("oil-loading").innerHTML = `
      <div class="ico">⚠️</div>
      <span>โหลดราคาน้ำมันไม่ได้: ${e.message}</span>
      <span style="font-size:12px;color:var(--text-dim)">ตรวจสอบว่าแท็บ "ราคาน้ำมัน" เปิด Public แล้ว</span>`;
  }
}

function renderOil(list, dateStr) {
  document.getElementById("oil-loading").style.display = "none";
  const container = document.getElementById("oil-container");
  container.style.display = "block";
  document.getElementById("oil-date-badge").textContent = dateStr ? "วันที่ " + dateStr : todayStr();

  if (list.length === 0) {
    container.innerHTML = `<div class="state-box">
      <div class="ico">—</div>
      <span>ยังไม่มีข้อมูลราคาน้ำมันวันนี้</span>
    </div>`;
    return;
  }

  let html = `<table>
    <thead><tr>
      <th>ชนิดน้ำมัน</th>
      <th class="right">ราคาวันนี้</th>
      <th class="right">เปลี่ยนจากเมื่อวาน</th>
    </tr></thead><tbody>`;

  for (const o of list) {
    let changeHtml = `<span style="color:var(--text-dim);font-size:12px">— ไม่มีข้อมูลเมื่อวาน</span>`;
    if (o.direction === "up" || o.direction === "down") {
      const sign = o.direction === "up" ? "+" : "−";
      changeHtml = `<span class="badge ${o.direction}">${sign}${Math.abs(o.diff).toFixed(2)} ฿ (${sign}${Math.abs(o.pct)}%)</span>`;
    } else if (o.direction === "same") {
      changeHtml = `<span class="badge same">ไม่เปลี่ยนแปลง</span>`;
    }
    html += `<tr>
      <td><span class="prod-name">${o.name}</span></td>
      <td class="right price-mono" style="font-weight:600">${fmt(o.price)}</td>
      <td class="right">${changeHtml}</td>
    </tr>`;
  }
  html += "</tbody></table>";
  container.innerHTML = html;
}

load();
loadOil();
</script>
